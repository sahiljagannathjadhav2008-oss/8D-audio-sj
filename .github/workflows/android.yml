name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build, test, and package release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release APK was produced
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No release APK found under app/build/outputs/apk/release"
            exit 1
          fi
          echo "Found APK at $APK_PATH"
          unzip -l "$APK_PATH" | grep -q "AndroidManifest.xml" || (echo "AndroidManifest.xml missing from APK" && exit 1)
          unzip -l "$APK_PATH" | grep -q "classes.dex" || (echo "classes.dex missing from APK" && exit 1)
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 8DAudio-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
